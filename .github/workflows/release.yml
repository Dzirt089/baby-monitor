name: Release

# Релиз создаётся только по SemVer-тегу vMAJOR.MINOR.PATCH: тег создаёт владелец или делегированный
# агент для тестовых сборок v0.x (docs/operations/release-runbook.md); теги не двигаются.
# Workflow никогда не создаёт и не двигает теги. Подпись возможна только при наличии
# signing secrets в GitHub Environment "release" (manual approval — только на планах GitHub
# с protection rules; см. docs/operations/release-runbook.md).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Verify build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate SemVer tag and version metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG is not SemVer vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR >= 100 || PATCH >= 100 )); then
            echo "::error::Version part out of range for versionCode formula (MINOR and PATCH must be < 100)"
            exit 1
          fi
          VERSION="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if (( VERSION_CODE <= 0 )); then
            echo "::error::Computed versionCode must be positive"
            exit 1
          fi
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::Computed versionCode exceeds the Android limit 2100000000"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' for this release"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "VERSION_MINOR=$MINOR" >> "$GITHUB_ENV"
          echo "VERSION_PATCH=$PATCH" >> "$GITHUB_ENV"
          echo "Validated version $VERSION (versionCode $VERSION_CODE)"

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install required Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Free disk space (runner image limit)
        run: |
          # На hosted runner образ содержит большие предустановленные NDK/system-images,
          # старые SDK и кэши; без очистки android workload может упереться в лимит диска.
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/share/dotnet/sdk/8.0.* /usr/share/dotnet/sdk/9.0.* \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/node \
                      /usr/share/swift /opt/microsoft/msedge
          df -h / /tmp /var/tmp /home || true

      - name: Install Android workload
        env:
          TMPDIR: /var/tmp
        run: |
          set -euo pipefail
          # Hosted runner иногда отдаёт "Disk quota exceeded" при установке workload
          # (даже при свободном месте) — повторяем с очисткой частичного состояния.
          for attempt in 1 2 3; do
            echo "Android workload install attempt $attempt"
            if dotnet workload install android; then
              echo "Android workload installed"
              exit 0
            fi
            echo "::warning::Android workload install failed (attempt $attempt); repairing"
            dotnet workload repair || true
            sleep 15
          done
          echo "::error::Android workload install failed after 3 attempts"
          df -h / /tmp /var/tmp /home || true
          exit 1

      - name: Restore
        run: dotnet restore BabyMonitor.slnx

      - name: Build (warnings as errors)
        run: dotnet build BabyMonitor.slnx --no-restore -c Release

      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          output="$(dotnet list BabyMonitor.slnx package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -qiE "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Test Domain
        run: |
          dotnet test tests/BabyMonitor.Domain.Tests/BabyMonitor.Domain.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=domain.trx" \
            --results-directory TestResults

      - name: Test Application
        run: |
          dotnet test tests/BabyMonitor.Application.Tests/BabyMonitor.Application.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=application.trx" \
            --results-directory TestResults

      - name: Architecture tests
        run: |
          dotnet test tests/BabyMonitor.Architecture.Tests/BabyMonitor.Architecture.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=architecture.trx" \
            --results-directory TestResults

      - name: Test Infrastructure (contract tests)
        run: |
          dotnet test tests/BabyMonitor.Infrastructure.Tests/BabyMonitor.Infrastructure.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=infrastructure.trx" \
            --results-directory TestResults

      - name: Publish unsigned dry-run APK (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          dotnet publish src/BabyMonitor.App/BabyMonitor.App.csproj \
            -c Release -f net10.0-android --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -o artifacts/dry-run-apk
          # В dry-run не публикуем debug-подписанный APK: только диагностический unsigned-артефакт.
          rm -f artifacts/dry-run-apk/*-Signed.apk

      - name: Upload dry-run APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-apk
          path: artifacts/dry-run-apk/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Explain dry-run result
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry-run only: no production signing was used and no GitHub Release was created." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish signed release
    # Только push тега: ручной workflow_dispatch всегда остаётся dry-run без production-подписи.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Environment release: signing secrets настроены; manual approval доступен только на планах
    # с protection rules (на GitHub Free недоступен — см. release-runbook).
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate SemVer tag and version metadata
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG is not SemVer vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR >= 100 || PATCH >= 100 )); then
            echo "::error::Version part out of range for versionCode formula (MINOR and PATCH must be < 100)"
            exit 1
          fi
          VERSION="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if (( VERSION_CODE <= 0 )); then
            echo "::error::Computed versionCode must be positive"
            exit 1
          fi
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::Computed versionCode exceeds the Android limit 2100000000"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' for this release"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "VERSION_MINOR=$MINOR" >> "$GITHUB_ENV"
          echo "VERSION_PATCH=$PATCH" >> "$GITHUB_ENV"

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the protected 'release' environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release is blocked until a permanent keystore and the 'release' environment secrets are prepared by the owner."
            exit 1
          fi

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install required Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Free disk space (runner image limit)
        run: |
          # На hosted runner образ содержит большие предустановленные NDK/system-images,
          # старые SDK и кэши; без очистки android workload может упереться в лимит диска.
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/share/dotnet/sdk/8.0.* /usr/share/dotnet/sdk/9.0.* \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/node \
                      /usr/share/swift /opt/microsoft/msedge
          df -h / /tmp /var/tmp /home || true

      - name: Install Android workload
        env:
          TMPDIR: /var/tmp
        run: |
          set -euo pipefail
          # Hosted runner иногда отдаёт "Disk quota exceeded" при установке workload
          # (даже при свободном месте) — повторяем с очисткой частичного состояния.
          for attempt in 1 2 3; do
            echo "Android workload install attempt $attempt"
            if dotnet workload install android; then
              echo "Android workload installed"
              exit 0
            fi
            echo "::warning::Android workload install failed (attempt $attempt); repairing"
            dotnet workload repair || true
            sleep 15
          done
          echo "::error::Android workload install failed after 3 attempts"
          df -h / /tmp /var/tmp /home || true
          exit 1

      - name: Restore
        run: dotnet restore BabyMonitor.slnx

      - name: Build (warnings as errors)
        run: dotnet build BabyMonitor.slnx --no-restore -c Release

      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          output="$(dotnet list BabyMonitor.slnx package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -qiE "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Test Domain
        run: |
          dotnet test tests/BabyMonitor.Domain.Tests/BabyMonitor.Domain.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=domain.trx" \
            --results-directory TestResults

      - name: Test Application
        run: |
          dotnet test tests/BabyMonitor.Application.Tests/BabyMonitor.Application.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=application.trx" \
            --results-directory TestResults

      - name: Architecture tests
        run: |
          dotnet test tests/BabyMonitor.Architecture.Tests/BabyMonitor.Architecture.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=architecture.trx" \
            --results-directory TestResults

      - name: Test Infrastructure (contract tests)
        run: |
          dotnet test tests/BabyMonitor.Infrastructure.Tests/BabyMonitor.Infrastructure.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=infrastructure.trx" \
            --results-directory TestResults

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Publish signed release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish src/BabyMonitor.App/BabyMonitor.App.csproj \
            -c Release -f net10.0-android --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:BabyMonitorVersionMajor="$VERSION_MAJOR" \
            -p:BabyMonitorVersionMinor="$VERSION_MINOR" \
            -p:BabyMonitorVersionPatch="$VERSION_PATCH" \
            -o artifacts/release-apk

      - name: Verify APK metadata and signing certificate
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          APK="$(ls artifacts/release-apk/*-Signed.apk)"
          APP_ID="$(dotnet msbuild src/BabyMonitor.App/BabyMonitor.App.csproj -getProperty:ApplicationId -nologo | tail -n 1 | tr -d '[:space:]')"
          echo "ApplicationId: $APP_ID"
          "$AAPT" dump badging "$APK" | grep -F "package: name='$APP_ID' versionCode='$VERSION_CODE' versionName='$VERSION'"
          CERT_DN="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate DN: //p')"
          echo "Signer DN: $CERT_DN"
          case "$CERT_DN" in
            *"CN=Android Debug"*)
              echo "::error::APK is signed with the Android debug certificate; refusing to publish"
              exit 1
              ;;
          esac

      - name: Compute SHA-256 checksum
        run: |
          set -euo pipefail
          cd artifacts/release-apk
          sha256sum ./*-Signed.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Generate update manifest
        run: |
          set -euo pipefail
          APK="$(ls artifacts/release-apk/*-Signed.apk)"
          APK_NAME="$(basename "$APK")"
          APK_SIZE="$(stat -c%s "$APK")"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          APP_ID="$(dotnet msbuild src/BabyMonitor.App/BabyMonitor.App.csproj -getProperty:ApplicationId -nologo | tail -n 1 | tr -d '[:space:]')"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > artifacts/release-apk/update-manifest.json <<EOF
          {
            "schemaVersion": 1,
            "packageId": "$APP_ID",
            "versionName": "$VERSION",
            "versionCode": $VERSION_CODE,
            "apkAssetName": "$APK_NAME",
            "sha256": "$APK_SHA",
            "sizeBytes": $APK_SIZE,
            "notes": "Release $VERSION",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF
          cat artifacts/release-apk/update-manifest.json
          jq empty artifacts/release-apk/update-manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            artifacts/release-apk/*-Signed.apk \
            artifacts/release-apk/app-release.apk.sha256 \
            artifacts/release-apk/update-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Радионяня $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"