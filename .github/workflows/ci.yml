name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-test:
    name: Build, tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install required Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Free disk space (runner image limit)
        run: |
          # На hosted runner образ содержит большие предустановленные NDK/system-images,
          # старые SDK и кэши; без очистки android workload не помещается (Disk quota exceeded).
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/share/dotnet/sdk/8.0.* /usr/share/dotnet/sdk/9.0.* \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/node \
                      /usr/share/swift /opt/microsoft/msedge
          df -h /

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore BabyMonitor.slnx

      - name: Build (warnings as errors)
        run: dotnet build BabyMonitor.slnx --no-restore -c Release

      - name: Repository hygiene
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(bin|obj|artifacts|TestResults)/|\.(keystore|jks|apk|aab)$|(^|/)signing\.properties$'; then
            echo "::error::Build or signing artifacts are tracked in git"
            exit 1
          fi

      - name: Test Domain
        run: |
          dotnet test tests/BabyMonitor.Domain.Tests/BabyMonitor.Domain.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=domain.trx" \
            --results-directory TestResults \
            --collect "XPlat Code Coverage"

      - name: Test Application
        run: |
          dotnet test tests/BabyMonitor.Application.Tests/BabyMonitor.Application.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=application.trx" \
            --results-directory TestResults \
            --collect "XPlat Code Coverage"

      - name: Architecture tests
        run: |
          dotnet test tests/BabyMonitor.Architecture.Tests/BabyMonitor.Architecture.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=architecture.trx" \
            --results-directory TestResults \
            --collect "XPlat Code Coverage"

      - name: Test Infrastructure (contract tests)
        run: |
          dotnet test tests/BabyMonitor.Infrastructure.Tests/BabyMonitor.Infrastructure.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=infrastructure.trx" \
            --results-directory TestResults \
            --collect "XPlat Code Coverage"

      - name: Package debug APK (artifact only, not a release)
        run: |
          dotnet publish src/BabyMonitor.App/BabyMonitor.App.csproj \
            -c Debug -f net10.0-android --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:EmbedAssembliesIntoApk=true \
            -o artifacts/debug-apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK (14 days, not a GitHub Release)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: artifacts/debug-apk/*-Signed.apk
          retention-days: 14
          if-no-files-found: warn
